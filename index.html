<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Vivo — Mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f5f0;color:#2d3748;}
header{background:#1a4731;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.2);}
header img.logo{height:52px;width:auto;display:block;border-radius:6px;}
header h1{font-size:1.15rem;font-weight:700;line-height:1.2;}
header p{font-size:0.72rem;opacity:.85;margin-top:2px;}
.bar{display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #e0ddd5;flex-wrap:wrap;align-items:center;}
.btn-t{padding:6px 16px;border-radius:20px;border:1.5px solid #1a4731;background:#fff;color:#1a4731;font-size:0.8rem;cursor:pointer;font-weight:600;transition:all .15s;}
.btn-t.on{background:#1a4731;color:#fff;}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
.chip{font-size:0.72rem;padding:4px 10px;border-radius:12px;background:#e8f5e9;color:#166534;font-weight:600;}
.chip.ag{background:#e0f2fe;color:#0369a1;}
#map{width:100%;height:calc(100vh - 108px);}
.legenda{position:absolute;bottom:28px;left:12px;background:#fff;padding:10px 14px;border-radius:10px;font-size:0.74rem;z-index:1000;line-height:1.9;max-width:185px;box-shadow:0 2px 10px rgba(0,0,0,.12);border:1px solid #e0ddd5;}
.legenda b{font-size:0.65rem;color:#718096;text-transform:uppercase;letter-spacing:.4px;display:block;margin-top:6px;margin-bottom:1px;}
.legenda b:first-child{margin-top:0;}
.load{position:absolute;inset:0;background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2000;gap:12px;font-size:1rem;color:#1a4731;}
.spin{width:36px;height:36px;border:4px solid #e0ddd5;border-top-color:#1a4731;border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <img class="logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFoAAAA8CAYAAADmBa1FAAAf+UlEQVR42u17d3hU1db+2vucMzVt0ntCaIGEICYQQUooQUCKKAmCKAmC" alt="Mapa Vivo">
  <div>
    <h1>Mapa Vivo</h1>
    <p>Conectando escolas, ciência e comunidade — Itamaracá-PE</p>
  </div>
</header>
<div class="bar">
  <button class="btn-t on" id="btn-al" onclick="setModo('alunos')">&#128100; Alunos</button>
  <button class="btn-t" id="btn-ag" onclick="setModo('agentes')">&#128119; Agentes</button>
  <button class="btn-t" id="btn-amb" onclick="setModo('ambos')">&#127758; Ambos</button>
  <div style="width:1px;background:#ddd;margin:0 4px;align-self:stretch;"></div>
  <button class="btn-t on" id="filt-todos" onclick="setFiltroTipo('todos')">Todos</button>
  <button class="btn-t" id="filt-lixo" onclick="setFiltroTipo('lixo')">&#128465; Lixo</button>
  <button class="btn-t" id="filt-poda" onclick="setFiltroTipo('poda')">&#127795; Poda</button>
  <button class="btn-t" id="filt-lixo_poda" onclick="setFiltroTipo('lixo_poda')">&#127795;&#128465; Lixo+Poda</button>
  <div class="chips">
    <span class="chip" id="stat-al">0 pontos alunos</span>
    <span class="chip ag" id="stat-ag">0 pontos agentes</span>
  </div>
</div>
<div style="position:relative;">
  <div id="map"></div>
  <div class="load" id="load"><div class="spin"></div><span>Carregando dados...</span></div>
  <div class="legenda" id="leg"></div>
</div>
<script>
// ── CONFIG ──────────────────────────────────────────────────────
const SHEET_ID = '1c7rQoSxD5apQhLZwoJ1penV76GVH1gkdvjl16OrsVEU';
const ABA_ALUNOS = 'Coordenadas';
const ABA_AGENTES = 'Agentes';
const COR_ALUNO = '#e53e3e';
let _corGrupo = {};
// ── Mapa ─────────────────────────────────────────────────────────
let map, _modo = 'alunos', _camAl = null, _camAg = null;
let _filtroTipo = 'todos';
let _dadosAl = [], _dadosAg = [];
function setFiltroTipo(tipo) {
    _filtroTipo = tipo;
    ['todos','lixo','poda','lixo_poda'].forEach(t => {
        document.getElementById('filt-'+t)?.classList.toggle('on', t === tipo);
    });
    _reaplicarCamadas();
}
function _filtrarPontos(lista) {
    if (_filtroTipo === 'todos') return lista;
    return lista.filter(p => (p.tipo_residuo || 'lixo') === _filtroTipo);
}
function _reaplicarCamadas() {
    if (!map) return;
    if (_camAl) map.removeLayer(_camAl);
    if (_camAg) map.removeLayer(_camAg);
    _camAl = camadaAlunos(_filtrarPontos(_dadosAl));
    _camAg = camadaAgentes(_filtrarPontos(_dadosAg));
    if (_modo !== 'agentes') _camAl.addTo(map);
    if (_modo !== 'alunos') _camAg.addTo(map);
    atualizarLegenda();
}
// ── Ícones SVG ───────────────────────────────────────────────────
function pinHTML(cor, tipo) {
    const m = {'lixo':'&#128465;','poda':'&#127795;','lixo_poda':'&#127795;&#128465;','limpo':'&#10003;','analise':'&#9888;'};
    const fs = {'lixo':13,'poda':13,'lixo_poda':9,'limpo':15,'analise':12}[tipo] || 13;
    const s = m[tipo] || m['lixo'];
    return '<div style="width:36px;height:46px;">'
        + '<svg width="36" height="46" viewBox="0 0 36 46" xmlns="http://www.w3.org/2000/svg">'
        + '<ellipse cx="18" cy="44" rx="7" ry="2.5" fill="rgba(0,0,0,0.15)"/>'
        + '<path d="M18 42C18 42 3 27 3 16C3 8.3 9.8 2 18 2C26.2 2 33 8.3 33 16C33 27 18 42 18 42Z" fill="'+cor+'" stroke="white" stroke-width="2.5"/>'
        + '<circle cx="18" cy="15" r="11" fill="white" fill-opacity="0.95"/>'
        + '<foreignObject x="4" y="5" width="28" height="22">'
        + '<div xmlns="http://www.w3.org/1999/xhtml" style="width:28px;height:22px;display:flex;align-items:center;justify-content:center;font-size:'+fs+'px;line-height:1;">'+s+'</div>'
        + '</foreignObject></svg></div>';
}
function icone(cor, tipo) {
    return L.divIcon({className:'', html:pinHTML(cor,tipo), iconSize:[36,46], iconAnchor:[18,46], popupAnchor:[0,-48]});
}
function tipoAg(st, tp) {
    if (st === 'limpo') return 'limpo';
    if (st === 'analise_operador') return 'analise';
    return tp || 'lixo';
}
// ── Ler Google Sheets ────────────────────────────────────────────
async function lerAba(aba) {
    const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent(aba);
    const res = await fetch(url);
    const txt = await res.text();
    const json = JSON.parse(txt.replace(/^[^\(]+\(/,'').replace(/\);?\s*$/,''));
    const cols = json.table.cols.map(c => c.label);
    return (json.table.rows || []).map(row => {
        const o = {};
        cols.forEach((c, i) => { o[c] = row.c && row.c[i] ? (row.c[i].v ?? '') : ''; });
        const urls = [];
        let n = 1;
        while (o['foto_url_' + n] !== undefined) {
            if (o['foto_url_' + n]) urls.push(o['foto_url_' + n]);
            n++;
        }
        if (!urls.length && o['foto_url']) urls.push(o['foto_url']);
        o._foto_urls = urls;
        return o;
    });
}
// ── Fallback de foto ─────────────────────────────────────────────
function criarImgComFallback(urls, style) {
    if (!urls || !urls.length) {
        return '<div style="background:#f7fafc;padding:10px;text-align:center;font-size:11px;color:#718096;">Foto n&#227;o dispon&#237;vel</div>';
    }
    const id = 'img_' + Math.random().toString(36).slice(2, 9);
    if (!window._imgFallbacks) window._imgFallbacks = {};
    window._imgFallbacks[id] = urls;
    return '<img id="'+id+'" src="'+urls[0]+'" style="'+style+'" onerror="_tentarProximaImg(this,\''+id+'\')">';
}
function _tentarProximaImg(el, id) {
    const urls = (window._imgFallbacks && window._imgFallbacks[id]) || [];
    const atual = el.src;
    const idx = urls.findIndex(u => atual.includes(u) || u === atual);
    if (idx >= 0 && idx < urls.length - 1) {
        el.src = urls[idx + 1];
    } else {
        el.onerror = null;
        el.outerHTML = '<div style="background:#f7fafc;padding:10px;text-align:center;font-size:11px;color:#718096;">Foto indispon&#237;vel</div>';
    }
}
// ── Camada alunos ────────────────────────────────────────────────
function camadaAlunos(rows) {
    const layer = L.layerGroup();
    rows.forEach(r => {
        const lat = parseFloat(r.latitude), lon = parseFloat(r.longitude);
        if (isNaN(lat) || isNaN(lon)) return;
        const tipo = r.tipo_residuo || 'lixo';
        const fotoHtml = criarImgComFallback(r._foto_urls, 'width:100%;max-height:180px;object-fit:cover;border-radius:4px 4px 0 0;display:block;');
        const popup = '<div style="min-width:200px;">'
            + fotoHtml
            + '<div style="background:'+COR_ALUNO+';color:#fff;font-weight:700;padding:6px 12px;font-size:12px;">&#128205; Grupo '+r.grupo+'</div>'
            + '<div style="padding:8px 12px;font-size:12px;line-height:1.9;color:#2d3748;">'
            + '<b>Foto:</b> '+(r.foto||'--')+'<br>'
            + '<b>Tipo:</b> '+({'lixo':'Lixo','poda':'Poda','lixo_poda':'Lixo+poda'}[tipo]||tipo)+'<br>'
            + '<b>Data:</b> '+(r.data||'--')+' '+(r.hora||'')+'<br>'
            + '<b>Coord.:</b> '+lat.toFixed(6)+', '+lon.toFixed(6)
            + '</div></div>';
        L.marker([lat, lon], {icon: icone(COR_ALUNO, tipo)}).bindPopup(popup, {maxWidth:240}).addTo(layer);
    });
    return layer;
}
// ── Histórico ────────────────────────────────────────────────────
let _histIdx = {};
window._histSlides = {};
function _navHistIdx(chave, delta, total) {
    if (_histIdx[chave] === undefined) _histIdx[chave] = 0;
    _histIdx[chave] = (_histIdx[chave] + delta + total) % total;
    _renderHistSlide(chave);
}
function _renderHistSlide(chave) {
    const el = document.getElementById('hist-slide-' + chave);
    const ind = document.getElementById('hist-ind-' + chave);
    if (!el) return;
    const slides = window._histSlides[chave] || [];
    if (!slides.length) return;
    const idx = _histIdx[chave] ?? 0;
    const s = slides[idx];
    if (!s) return;
    if (ind) ind.textContent = (idx + 1) + '/' + slides.length;
    const fotoEl = el.closest('.leaflet-popup-content')?.querySelector('.hist-foto-wrap');
    if (s.tipo === 'aluno') {
        el.innerHTML = '<div style="background:#dbeafe;border-radius:6px;padding:7px 10px;font-size:12px;line-height:1.7;color:#1e3a8a;">'
            + '<b style="color:#1e40af;">&#128100; Aluno ref.</b> Gr '+s.grupo+' — '+s.foto+'<br>'
            + (s.data ? '<b>Data:</b> '+s.data+' '+(s.hora||'')+'<br>' : '')
            + (s.lat ? '<b>Coord:</b> '+parseFloat(s.lat).toFixed(5)+', '+parseFloat(s.lon).toFixed(5) : '')
            + '</div>';
    } else {
        const cor = s.status === 'limpo' ? '#16a34a' : s.status === 'recorrencia' ? '#d97706' : '#e53e3e';
        const labelSt = {'recorrencia':'Recorrência','limpo':'Local limpo','novo_ponto':'Ponto novo'}[s.status] || s.status;
        const labelTp = {'lixo':'Lixo','poda':'Poda','lixo_poda':'Lixo+Poda'}[s.tipo_residuo] || '--';
        el.innerHTML = '<div style="border-left:3px solid '+cor+';padding:5px 9px;background:#f9fafb;border-radius:0 5px 5px 0;font-size:12px;line-height:1.7;color:#374151;">'
            + '<b style="color:'+cor+';">&#128119; Visita '+(idx)+'/'+(slides.length-1)+' — '+labelSt+'</b><br>'
            + '<b>Tipo:</b> '+labelTp+'<br>'
            + '<b>Data:</b> '+(s.data||'--')+' '+(s.hora||'')
            + '</div>';
    }
    // Atualiza a foto
    if (fotoEl) {
        if (s.urls && s.urls.length) {
            fotoEl.innerHTML = criarImgComFallback(s.urls, 'width:100%;max-height:160px;object-fit:contain;background:#000;display:block;');
        } else {
            fotoEl.innerHTML = '<div style="background:#f7fafc;padding:20px;text-align:center;font-size:12px;color:#718096;">Sem foto</div>';
        }
    }
}
function camadaAgentes(rows) {
    const layer = L.layerGroup();
    const _cores = {'novo_ponto':'#e53e3e','recorrencia':'#d69e2e','limpo':'#38a169','analise_operador':'#d69e2e'};
    const _labels = {'novo_ponto':'Ponto sem registro','recorrencia':'Recorrência','limpo':'Local limpo','analise_operador':'Recorrência'};
    const _tipos = {'lixo':'Lixo','poda':'Poda','lixo_poda':'Lixo+poda'};
    // Agrupa por referência
    const _hist = {};
    rows.forEach(r => {
        if (r.ref_grupo && r.ref_foto) {
            const chave = r.ref_grupo + '_' + r.ref_foto;
            if (!_hist[chave]) _hist[chave] = [];
            _hist[chave].push(r);
        }
    });
    Object.values(_hist).forEach(arr => {
        arr.sort((a, b) => ((a.data||'') + (a.hora||'')).localeCompare((b.data||'') + (b.hora||'')));
    });
    rows.forEach(r => {
        const lat = parseFloat(r.latitude), lon = parseFloat(r.longitude);
        if (isNaN(lat) || isNaN(lon)) return;
        const st = r.status || 'novo_ponto';
        const cor = _cores[st] || '#718096';
        const chave = (r.ref_grupo && r.ref_foto) ? r.ref_grupo + '_' + r.ref_foto : null;
        const histArr = chave ? (_hist[chave] || []) : [];
        const temHist = !!chave;
        let popup = '';
        let slides = [];
        let idxAtual = 1;
        if (temHist) {
            // Busca a foto real do aluno
            const alunoRef = _dadosAl.find(a =>
                String(a.grupo) === String(r.ref_grupo) &&
                String(a.foto) === String(r.ref_foto)
            );
            const urlsAluno = alunoRef ? (alunoRef._foto_urls || []) : [];
            // Slide 0 = Aluno
            slides.push({
                tipo: 'aluno',
                grupo: r.ref_grupo,
                foto: r.ref_foto,
                lat: lat,
                lon: lon,
                data: alunoRef ? alunoRef.data : '',
                hora: alunoRef ? alunoRef.hora : '',
                urls: urlsAluno
            });
            // Slides dos agentes
            histArr.forEach(ag => {
                slides.push({
                    tipo: 'agente',
                    foto: ag.foto,
                    data: ag.data,
                    hora: ag.hora,
                    status: ag.status,
                    tipo_residuo: ag.tipo_residuo,
                    urls: ag._foto_urls || []
                });
            });
            idxAtual = Math.max(1, histArr.findIndex(x => x.foto === r.foto) + 1);
            popup = '<div style="min-width:260px;max-width:300px;">'
                + '<div style="background:'+cor+';color:#fff;font-weight:700;padding:8px 12px;border-radius:4px 4px 0 0;font-size:12px;display:flex;justify-content:space-between;align-items:center;">'
                + '<span>&#128119; '+(_labels[st]||st)+'</span>'
                + '<span style="display:flex;align-items:center;gap:5px;">'
                + '<button id="hp-'+chave+'-p" style="background:rgba(255,255,255,0.25);border:none;color:#fff;border-radius:4px;width:22px;height:22px;cursor:pointer;font-size:12px;">◀</button>'
                + '<span id="hist-ind-'+chave+'" style="font-size:11px;min-width:36px;text-align:center;">'+(idxAtual+1)+'/'+slides.length+'</span>'
                + '<button id="hp-'+chave+'-n" style="background:rgba(255,255,255,0.25);border:none;color:#fff;border-radius:4px;width:22px;height:22px;cursor:pointer;font-size:12px;">▶</button>'
                + '</span></div>'
                + '<div class="hist-foto-wrap">'
                + criarImgComFallback(r._foto_urls, 'width:100%;max-height:160px;object-fit:contain;background:#000;display:block;')
                + '</div>'
                + '<div id="hist-slide-'+chave+'" style="padding:8px 10px;"></div>'
                + '</div>';
            window._histSlides[chave] = slides;
        } else {
            const fotoHtml = criarImgComFallback(r._foto_urls, 'width:100%;max-height:160px;object-fit:contain;background:#000;border-radius:4px 4px 0 0;display:block;');
            popup = '<div style="min-width:200px;">'
                + fotoHtml
                + '<div style="background:'+cor+';color:#fff;font-weight:700;padding:6px 12px;font-size:12px;">&#128119; Fiscal — '+(_labels[st]||st)+'</div>'
                + '<div style="padding:8px 12px;font-size:12px;line-height:1.9;color:#2d3748;">'
                + '<b>Foto:</b> '+(r.foto||'--')+'<br>'
                + '<b>Tipo:</b> '+(_tipos[r.tipo_residuo]||'--')+'<br>'
                + '<b>Data:</b> '+(r.data||'--')+' '+(r.hora||'')
                + '</div></div>';
        }
        const marker = L.marker([lat, lon], {icon: icone(cor, tipoAg(st, r.tipo_residuo))});
        marker.bindPopup(popup, {maxWidth: 310});
        if (temHist) {
            marker.on('popupopen', () => {
                setTimeout(() => {
                    _histIdx[chave] = idxAtual;
                    _renderHistSlide(chave);
                    const bp = document.getElementById('hp-' + chave + '-p');
                    const bn = document.getElementById('hp-' + chave + '-n');
                    const total = (window._histSlides[chave] || []).length;
                    if (bp) bp.onclick = (e) => { e.stopPropagation(); _navHistIdx(chave, -1, total); };
                    if (bn) bn.onclick = (e) => { e.stopPropagation(); _navHistIdx(chave, 1, total); };
                }, 50);
            });
        }
        marker.addTo(layer);
    });
    return layer;
}
// ── Toggle ───────────────────────────────────────────────────────
function setModo(modo) {
    _modo = modo;
    ['alunos','agentes','ambos'].forEach(m => {
        const id = 'btn-' + m.replace('alunos','al').replace('agentes','ag').replace('ambos','amb');
        document.getElementById(id)?.classList.toggle('on', m === modo);
    });
    if (_camAl) map.removeLayer(_camAl);
    if (_camAg) map.removeLayer(_camAg);
    if (modo !== 'agentes' && _camAl) _camAl.addTo(map);
    if (modo !== 'alunos' && _camAg) _camAg.addTo(map);
    atualizarLegenda();
}
// ── Legenda ──────────────────────────────────────────────────────
function atualizarLegenda() {
    const el = document.getElementById('leg');
    let h = '';
    if (_modo !== 'agentes') {
        h += '<b>Alunos</b><div><span style="color:#e53e3e;">●</span> Pontos dos alunos</div>';
        h += '<b>Tipo resíduo</b><div>🗑 Lixo</div><div>🌳 Poda</div><div>🌳🗑 Lixo+poda</div>';
    }
    if (_modo !== 'alunos') {
        h += '<b>Fiscais</b>'
            + '<div><span style="color:#e53e3e;">●</span> Ponto sem registro</div>'
            + '<div><span style="color:#d69e2e;">●</span> Recorrência</div>'
            + '<div><span style="color:#38a169;">●</span> Local limpo</div>';
    }
    el.innerHTML = h;
}
// ── Init ─────────────────────────────────────────────────────────
async function init() {
    map = L.map('map').setView([-7.748, -34.831], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
    }).addTo(map);
    try {
        const [rAl, rAg] = await Promise.all([
            lerAba(ABA_ALUNOS).catch(() => []),
            lerAba(ABA_AGENTES).catch(() => [])
        ]);
        _dadosAl = rAl;
        _dadosAg = rAg;
        document.getElementById('stat-al').textContent = rAl.length + ' pontos alunos';
        document.getElementById('stat-ag').textContent = rAg.length + ' pontos agentes';
        _reaplicarCamadas();
        const todos = [...rAl, ...rAg]
            .filter(r => !isNaN(parseFloat(r.latitude)))
            .map(r => [parseFloat(r.latitude), parseFloat(r.longitude)]);
        if (todos.length) map.fitBounds(L.latLngBounds(todos), {padding: [30, 30]});
        document.getElementById('load').style.display = 'none';
    } catch (e) {
        document.getElementById('load').innerHTML = '<div style="font-size:2rem;">⚠</div><b>Erro ao carregar</b><p style="font-size:0.85rem;color:#718096;margin-top:8px;">'+e.message+'</p>';
    }
}
window.addEventListener('load', init);
</script>
</body>
</html>
