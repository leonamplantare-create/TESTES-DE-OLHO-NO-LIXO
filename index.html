<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Vivo — Mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f5f0;color:#2d3748;}
header{background:#1E5A8C;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.2);}
header img.logo{height:52px;width:auto;display:block;border-radius:6px;flex-shrink:0;}
header h1{font-size:1.1rem;font-weight:700;line-height:1.2;}
header p{font-size:0.72rem;opacity:.8;}
.bar{display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #e0ddd5;flex-wrap:wrap;align-items:center;}
.btn-t{padding:6px 16px;border-radius:20px;border:1.5px solid #1E5A8C;background:#fff;color:#1E5A8C;font-size:0.8rem;cursor:pointer;font-weight:600;transition:all .15s;}
.btn-t.on{background:#1E5A8C;color:#fff;}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
.chip{font-size:0.72rem;padding:4px 10px;border-radius:12px;background:#e8f5e9;color:#166534;font-weight:600;}
.chip.ag{background:#e0f2fe;color:#0369a1;}
#map{width:100%;height:calc(100vh - 108px);}
.legenda{position:absolute;bottom:28px;left:12px;background:#fff;padding:10px 14px;border-radius:10px;font-size:0.74rem;z-index:1000;line-height:1.9;max-width:185px;box-shadow:0 2px 10px rgba(0,0,0,.12);border:1px solid #e0ddd5;}
.legenda b{font-size:0.65rem;color:#718096;text-transform:uppercase;letter-spacing:.4px;display:block;margin-top:6px;margin-bottom:1px;}
.legenda b:first-child{margin-top:0;}
.load{position:absolute;inset:0;background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2000;gap:12px;font-size:1rem;color:#1E5A8C;}
.spin{width:36px;height:36px;border:4px solid #e0ddd5;border-top-color:#1E5A8C;border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.tooltip-bairro {
    background: rgba(255,255,255,0.95);
    border: none;
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.75rem;
    color: #1a4731;
    padding: 4px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
</style>
</head>

<script>
const SHEET_ID   = '1Q9hG2uVnnP0kbKCdiVjUWwhW6Bi9TjajEYXS0dlZMsk';
const ABA_ALUNOS = 'Coordenadas';
const ABA_AGENTES= 'Agentes';

const COR_ALUNO = '#e53e3e';
let _corGrupo = {};

let map, _modo = 'alunos', _camAl = null, _camAg = null;
let _filtroTipo = 'todos';
let _dadosAl = [], _dadosAg = [];

function setFiltroTipo(tipo) {
    _filtroTipo = tipo;
    ['todos','lixo','poda','lixo_poda'].forEach(t => {
        document.getElementById('filt-'+t)?.classList.toggle('on', t === tipo);
    });
    _reaplicarCamadas();
}

function _coordValida(lat, lon) {
    return lat >= -7.90 && lat <= -7.60 && lon >= -35.00 && lon <= -34.70;
}

function _filtrarPontos(lista) {
    const validos = lista.filter(p => {
        const lat = parseFloat(p.latitude);
        const lon = parseFloat(p.longitude);
        return !isNaN(lat) && !isNaN(lon) && _coordValida(lat, lon);
    });
    let result = _filtroTipo === 'todos' ? validos : validos.filter(p => (p.tipo_residuo || 'lixo') === _filtroTipo);
    if (_bairroSelecionado) {
        result = result.filter(p => {
            const lat = parseFloat(p.latitude), lon = parseFloat(p.longitude);
            return _pontoNoBairro(lat, lon, _bairroSelecionado.poligono);
        });
    }
    return result;
}

function _reaplicarCamadas() {
    if (!map) return;
    _allMarkers = [];
    _ultimaEscala = null;
    if (_camAl) map.removeLayer(_camAl);
    if (_camAg) map.removeLayer(_camAg);
    _camAl = camadaAlunos(_filtrarPontos(_dadosAl));
    _camAg = camadaAgentes(_filtrarPontos(_dadosAg));
    if (_modo !== 'agentes') _camAl.addTo(map);
    if (_modo !== 'alunos')  _camAg.addTo(map);
    atualizarLegenda();
}

function pinHTML(cor, tipo, scale) {
    scale = scale || 1;
    const w = Math.round(32 * scale), h = Math.round(42 * scale);
    const ball = Math.max(8, Math.round(32 * scale));
    const inner = Math.max(6, Math.round(28 * scale));
    const top = Math.max(1, Math.round(2 * scale));
    // emoji acompanha o pino (mín 5px para ainda dar para ver)
    const baseFs = (tipo === 'lixo_poda') ? 11 : 13;
    const fs = Math.max(5, Math.min(18, Math.round(baseFs * scale)));
    const border = scale < 0.45 ? 1 : 2;
    const emoji = {'lixo':'🗑','poda':'🌳','lixo_poda':'🌳🗑','limpo':'✓','analise':'⚠'}[tipo]||'🗑';
    return '<div class="mv-pin" style="position:relative;width:'+w+'px;height:'+h+'px;">'
        +'<div style="'
        +'width:'+ball+'px;height:'+ball+'px;border-radius:50% 50% 50% 0;'
        +'background:'+cor+';border:'+border+'px solid #fff;'
        +'transform:rotate(-45deg);'
        +'box-shadow:0 '+Math.max(1,Math.round(2*scale))+'px '+Math.max(2,Math.round(6*scale))+'px rgba(0,0,0,0.3);'
        +'position:absolute;top:0;left:0;'
        +'"></div>'
        +'<div style="'
        +'position:absolute;top:'+top+'px;left:'+top+'px;'
        +'width:'+inner+'px;height:'+inner+'px;'
        +'display:flex;align-items:center;justify-content:center;'
        +'font-size:'+fs+'px;line-height:1;z-index:1;'
        +'">'+emoji+'</div>'
        +'</div>';
}
// Limites de escala do pino (trava mínima e máxima)
const PIN_SCALE_MIN = 0.35;
const PIN_SCALE_MAX = 1.25;
function _pinScale() {
    if (!map) return 1;
    const z = map.getZoom();
    let s;
    if (z <= 11) s = 0.35;
    else if (z === 12) s = 0.42;
    else if (z === 13) s = 0.55;
    else if (z === 14) s = 0.72;
    else if (z === 15) s = 0.90;
    else if (z === 16) s = 1.08;
    else if (z === 17) s = 1.18;
    else s = 1.25;
    // trava
    if (s < PIN_SCALE_MIN) s = PIN_SCALE_MIN;
    if (s > PIN_SCALE_MAX) s = PIN_SCALE_MAX;
    return s;
}

// ── Escala dos pinos com zoom ───────────────────────────────────
let _allMarkers = [];
let _escalaTimer = null;
let _ultimaEscala = null;
function _trackMarker(m, cor, tipo) {
    m._mvCor = cor; m._mvTipo = tipo;
    _allMarkers.push(m);
    return m;
}
function _atualizarEscalaPinos() {
    const s = _pinScale();
    // evita refazer ícones se a escala não mudou (zoomend às vezes dispara à toa)
    if (_ultimaEscala !== null && Math.abs(_ultimaEscala - s) < 0.01) return;
    _ultimaEscala = s;
    _allMarkers.forEach(function(m) {
        if (!m || !m._mvCor) return;
        try { m.setIcon(icone(m._mvCor, m._mvTipo)); } catch(e) {}
    });
}
function _agendarEscalaPinos() {
    if (_escalaTimer) clearTimeout(_escalaTimer);
    _escalaTimer = setTimeout(_atualizarEscalaPinos, 40);
}

function icone(cor, tipo) {
    const s = _pinScale();
    const w = Math.round(32 * s), h = Math.round(42 * s);
    return L.divIcon({
        className: 'mv-pin-icon',
        html: pinHTML(cor, tipo, s),
        iconSize: [w, h],
        iconAnchor: [Math.round(w/2), h],
        popupAnchor: [0, -h + 2]
    });
}
function tipoAg(st,tp){ if(st==='limpo')return 'limpo'; if(st==='analise_operador')return 'analise'; return tp||'lixo'; }

async function lerAba(aba) {
    const url = 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&sheet='+encodeURIComponent(aba);
    const res = await fetch(url);
    const txt = await res.text();
    const json = JSON.parse(txt.replace(/^[^\(]+\(/,'').replace(/\);?\s*$/,''));
    const cols = json.table.cols.map(c=>c.label);
    return (json.table.rows||[]).map(row=>{
        const o={};
        cols.forEach((c,i)=>{ o[c]=row.c&&row.c[i]?row.c[i].v??'':''; });
        const urls = [];
        let n=1;
        while (o['foto_url_'+n] !== undefined) {
            if (o['foto_url_'+n]) urls.push(o['foto_url_'+n]);
            n++;
        }
        if (!urls.length && o['foto_url']) urls.push(o['foto_url']);
        o._foto_urls = urls;
        const refUrls = [];
        let m=1;
        while (o['ref_foto_url_'+m] !== undefined) {
            if (o['ref_foto_url_'+m]) refUrls.push(o['ref_foto_url_'+m]);
            m++;
        }
        o._ref_foto_urls = refUrls;
        return o;
    });
}

function criarImgComFallback(urls, style) {
    if (!urls || !urls.length) return '<div style="background:#f7fafc;padding:10px;text-align:center;font-size:11px;color:#718096;">Foto n&#227;o dispon&#237;vel</div>';
    if (!window._imgUrls) window._imgUrls = {};
    const id = 'img_' + Math.random().toString(36).slice(2,8);
    window._imgUrls[id] = urls;
    return '<img id="'+id+'" src="'+urls[0]+'" style="'+style+'" onerror="window._imgErr(this)">';
}

function _imgErr(el) {
    if (el._idx === undefined) el._idx = 0;
    el._idx++;
    const u = window._imgUrls && window._imgUrls[el.id] || [];
    if (el._idx < u.length) {
        el.src = u[el._idx];
    } else {
        el.onerror = null;
        el.outerHTML = '<div style="padding:10px;text-align:center;font-size:11px;color:#718096;">Foto indispon&#237;vel</div>';
    }
}

function camadaAlunos(rows) {
    const layer = L.layerGroup();
    const grupos = [...new Set(rows.map(r=>r.grupo))].sort();
    grupos.forEach(g=>{ _corGrupo[g]=COR_ALUNO; });
    let _pinCount = 0;
    rows.forEach(r=>{
        const lat=parseFloat(r.latitude), lon=parseFloat(r.longitude);
        if(isNaN(lat)||isNaN(lon)||!_coordValida(lat,lon)) return;
        _pinCount++;
        const cor = COR_ALUNO;
        const tipo= r.tipo_residuo||'lixo';
        const fotoHtml = criarImgComFallback(r._foto_urls, 'width:100%;max-height:180px;object-fit:cover;border-radius:4px 4px 0 0;display:block;');
        const popup = '<div style="min-width:200px;">'
            + fotoHtml
            +'<div style="background:'+cor+';color:#fff;font-weight:700;padding:6px 12px;font-size:12px;">&#128205; Grupo '+r.grupo+'</div>'
            +'<div style="padding:8px 12px;">'
            +'<div style="font-size:12px;line-height:1.9;color:#2d3748;">'
            +'<b>Foto:</b> '+(r.foto||'--')+'<br>'
            +'<b>Tipo:</b> '+({'lixo':'Lixo','poda':'Poda','lixo_poda':'Lixo+poda'}[tipo]||tipo)+'<br>'
            +'<b>Data:</b> '+(r.data||'--')+' '+(r.hora||'')+'<br>'
            +'<b>Coord.:</b> '+lat.toFixed(6)+', '+lon.toFixed(6)
            +'</div></div></div>';
        _trackMarker(L.marker([lat,lon],{icon:icone(cor,tipo)}), cor, tipo).bindPopup(popup,{maxWidth:240}).addTo(layer);
    });
    console.log("[alunos] pins marcados:", _pinCount);
    return layer;
}

let _histIdx = {};
window._histSlides = {};

function _safeId(chave) {
    return String(chave || '').replace(/[^a-zA-Z0-9_-]/g, '_');
}

function _navHistIdx(chave, delta) {
    const slides = (window._histSlides && window._histSlides[chave]) || [];
    const total = slides.length;
    if (!total) return;
    if (_histIdx[chave] === undefined) _histIdx[chave] = 0;
    _histIdx[chave] = (_histIdx[chave] + delta + total) % total;
    _renderHistSlide(chave);
}

function _abrirLightbox(src) {
    if (!src) return;
    let ov = document.getElementById('mv-lightbox');
    if (!ov) {
        ov = document.createElement('div');
        ov.id = 'mv-lightbox';
        ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:99999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;';
        ov.addEventListener('click', function(){ ov.style.display = 'none'; });
        const img = document.createElement('img');
        img.id = 'mv-lightbox-img';
        img.style.cssText = 'max-width:96vw;max-height:92vh;object-fit:contain;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,0.5);cursor:default;';
        img.addEventListener('click', function(e){ e.stopPropagation(); });
        ov.appendChild(img);
        document.body.appendChild(ov);
    }
    document.getElementById('mv-lightbox-img').src = src;
    ov.style.display = 'flex';
}

function _bindFotoZoom(container) {
    if (!container) return;
    container.querySelectorAll('img').forEach(function(img){
        img.style.cursor = 'zoom-in';
        img.onclick = function(e){
            e.preventDefault();
            e.stopPropagation();
            _abrirLightbox(img.currentSrc || img.src);
        };
    });
}

function _renderHistSlide(chave) {
    const sid = _safeId(chave);
    const el   = document.getElementById('hist-slide-' + sid);
    const ind  = document.getElementById('hist-ind-' + sid);
    const meta = document.getElementById('hist-meta-' + sid);
    const fotoEl = document.getElementById('hist-foto-' + sid);
    const slides = (window._histSlides && window._histSlides[chave]) || [];
    if (!slides.length) return;

    let idx = (_histIdx[chave] !== undefined) ? _histIdx[chave] : 0;
    if (idx < 0 || idx >= slides.length) idx = 0;
    _histIdx[chave] = idx;
    const s = slides[idx];
    if (!s) return;

    if (ind) ind.textContent = (idx + 1) + '/' + slides.length;

    if (el) {
        var body = '';
        if (s.tipo === 'aluno') {
            body = '<div style="background:#dbeafe;border-radius:6px;padding:7px 10px;font-size:12px;line-height:1.7;color:#1e3a8a;">'
                + '<b style="color:#1e40af;">&#128100; Aluno ref.</b> Gr ' + (s.grupo||'') + ' — ' + (s.foto||'') + '<br>'
                + (s.data ? '<b>Data:</b> ' + s.data + ' ' + (s.hora||'') + '<br>' : '')
                + (s.lat ? '<b>Coord:</b> ' + parseFloat(s.lat).toFixed(5) + ', ' + parseFloat(s.lon).toFixed(5) : '')
                + '</div>';
        } else {
            var cor = s.status==='limpo' ? '#16a34a' : (s.status==='recorrencia'||s.status==='analise_operador') ? '#d97706' : '#e53e3e';
            var labelSt = ({'recorrencia':'Recorrência','limpo':'Local limpo','novo_ponto':'Ponto novo','analise_operador':'Recorrência'})[s.status] || s.status;
            var labelTp = ({'lixo':'Lixo','poda':'Poda','lixo_poda':'Lixo+Poda'})[s.tipo_residuo] || '--';
            body = '<div style="border-left:3px solid ' + cor + ';padding:5px 9px;background:#f9fafb;border-radius:0 5px 5px 0;font-size:12px;line-height:1.7;color:#374151;">'
                + '<b style="color:' + cor + ';">&#128119; Visita — ' + labelSt + '</b><br>'
                + '<b>Tipo:</b> ' + labelTp + '<br>'
                + '<b>Data:</b> ' + (s.data||'--') + ' ' + (s.hora||'')
                + '</div>';
        }
        el.innerHTML = body;
    }

    if (meta) {
        meta.innerHTML = '<b style="color:#2d3748;">' + (s.foto||'--') + '</b>'
            + ' &nbsp;|&nbsp; ' + (s.data||'--') + ' ' + (s.hora||'')
            + (s.lat ? '<br>Coord.: ' + parseFloat(s.lat).toFixed(5) + ', ' + parseFloat(s.lon).toFixed(5) : '')
            + '<br>Tipo: ' + (({'lixo':'Lixo','poda':'Poda','lixo_poda':'Lixo+Poda'})[s.tipo_residuo]||'--');
    }

    if (fotoEl) {
        if (s.urls && s.urls.length) {
            fotoEl.innerHTML = criarImgComFallback(s.urls, 'width:100%;max-height:160px;object-fit:contain;background:#000;display:block;border-radius:4px 4px 0 0;');
            setTimeout(function(){ _bindFotoZoom(fotoEl); }, 30);
        } else {
            fotoEl.innerHTML = '<div style="background:#f7fafc;padding:20px;text-align:center;font-size:12px;color:#718096;">Sem foto</div>';
        }
    }
}

function _bindHistNav(chave) {
    var sid = _safeId(chave);
    var bp = document.getElementById('hp-' + sid + '-p');
    var bn = document.getElementById('hp-' + sid + '-n');
    function wire(btn, delta) {
        if (!btn) return;
        if (window.L && L.DomEvent) {
            L.DomEvent.disableClickPropagation(btn);
            L.DomEvent.disableScrollPropagation(btn);
        }
        btn.style.pointerEvents = 'auto';
        btn.onmousedown = function(e){ e.preventDefault(); e.stopPropagation(); };
        btn.onclick = function(e){
            e.preventDefault();
            e.stopPropagation();
            _navHistIdx(chave, delta);
            return false;
        };
    }
    wire(bp, -1);
    wire(bn, 1);
    _bindFotoZoom(document.getElementById('hist-foto-' + sid));
}

function _normFotoNome(s) {
    return String(s || '').toLowerCase().replace(/\.(jpeg|jpg|png|webp|gif)$/i, '').trim();
}

function _urlsAlunoRef(refGrupo, refFoto) {
    const target = _normFotoNome(refFoto);
    if (!target) return [];
    const lista = _dadosAl || [];
    // 1) grupo + foto
    for (let i = 0; i < lista.length; i++) {
        const a = lista[i];
        if (String(a.grupo) === String(refGrupo) && _normFotoNome(a.foto) === target) {
            if (a._foto_urls && a._foto_urls.length) return a._foto_urls.slice();
        }
    }
    // 2) só pelo nome da foto
    for (let i = 0; i < lista.length; i++) {
        const a = lista[i];
        if (_normFotoNome(a.foto) === target && a._foto_urls && a._foto_urls.length) {
            return a._foto_urls.slice();
        }
    }
    return [];
}

function _chaveHistorico(r, lat, lon) {
    // Recorrência real: mesmo aluno de referência
    if (r.ref_grupo && r.ref_foto) {
        return 'ref_' + String(r.ref_grupo).trim() + '_' + _normFotoNome(r.ref_foto);
    }
    // Empilhados no mesmo ponto (~1 m) — não mistura locais diferentes
    return 'grid_' + lat.toFixed(5) + '_' + lon.toFixed(5);
}

function camadaAgentes(rows) {
    const layer = L.layerGroup();
    const _cores = {'novo_ponto':'#e53e3e','recorrencia':'#d69e2e','limpo':'#38a169','analise_operador':'#d69e2e'};
    const _labels= {'novo_ponto':'Ponto sem registro','recorrencia':'Recorrência','limpo':'Local limpo','analise_operador':'Recorrência'};
    const _tipos = {'lixo':'Lixo','poda':'Poda','lixo_poda':'Lixo+poda'};

    // Agrupa SOMENTE por chave de histórico (ref do aluno OU grid apertado)
    // NÃO usa distância frouxa — evitava misturar cenário A com cenário B
    const grupos = {};
    rows.forEach(r => {
        const lat = parseFloat(r.latitude), lon = parseFloat(r.longitude);
        if (isNaN(lat) || isNaN(lon)) return;
        const chave = _chaveHistorico(r, lat, lon);
        if (!grupos[chave]) grupos[chave] = [];
        grupos[chave].push({ r: r, lat: lat, lon: lon });
    });
    Object.keys(grupos).forEach(function(k) {
        grupos[k].sort(function(a, b) {
            return ((a.r.data||'') + (a.r.hora||'')).localeCompare((b.r.data||'') + (b.r.hora||''));
        });
    });

    rows.forEach(function(r) {
        const lat = parseFloat(r.latitude), lon = parseFloat(r.longitude);
        if (isNaN(lat) || isNaN(lon)) return;
        const st  = r.status || 'novo_ponto';
        const cor = _cores[st] || '#718096';
        const chave = _chaveHistorico(r, lat, lon);
        const membros = grupos[chave] || [{ r: r, lat: lat, lon: lon }];

        // Slides: foto(s) do aluno ref (se houver) + visitas do agente neste grupo
        const slides = [];
        const refsFeitos = {};
        membros.forEach(function(m) {
            const rr = m.r;
            if (rr.ref_grupo && rr.ref_foto) {
                const rk = String(rr.ref_grupo).trim() + '_' + _normFotoNome(rr.ref_foto);
                if (!refsFeitos[rk]) {
                    refsFeitos[rk] = true;
                    var urlsAluno = (rr._ref_foto_urls && rr._ref_foto_urls.length)
                        ? rr._ref_foto_urls.slice()
                        : _urlsAlunoRef(rr.ref_grupo, rr.ref_foto);
                    slides.push({
                        tipo: 'aluno',
                        grupo: rr.ref_grupo,
                        foto: rr.ref_foto,
                        lat: rr.ref_lat || m.lat,
                        lon: rr.ref_lon || m.lon,
                        data: rr.data,
                        hora: rr.hora,
                        urls: urlsAluno,
                        status: rr.status,
                        tipo_residuo: rr.tipo_residuo
                    });
                }
            }
        });
        membros.forEach(function(m) {
            const rr = m.r;
            slides.push({
                tipo: 'agente',
                foto: rr.foto,
                data: rr.data,
                hora: rr.hora,
                status: rr.status,
                tipo_residuo: rr.tipo_residuo,
                lat: m.lat,
                lon: m.lon,
                urls: rr._foto_urls || []
            });
        });

        window._histSlides[chave] = slides;
        const temHist = slides.length > 1;
        let idxAtual = slides.findIndex(function(s){ return s.tipo === 'agente' && s.foto === r.foto; });
        if (idxAtual < 0) idxAtual = slides.length - 1;

        const sid = _safeId(chave);
        let popup;
        if (temHist) {
            popup = '<div style="min-width:260px;max-width:300px;">'
                +'<div style="background:'+cor+';color:#fff;font-weight:700;padding:8px 12px;border-radius:4px 4px 0 0;font-size:12px;display:flex;justify-content:space-between;align-items:center;">'
                +'<span>&#128119; '+(_labels[st]||st)+' <span style="opacity:.85;font-weight:600;font-size:11px;">('+slides.length+' fotos)</span></span>'
                +'<span style="display:flex;align-items:center;gap:5px;">'
                +'<button type="button" id="hp-'+sid+'-p" style="background:rgba(255,255,255,0.25);border:none;color:#fff;border-radius:4px;width:26px;height:26px;cursor:pointer;font-size:14px;line-height:1;">&#9664;</button>'
                +'<span id="hist-ind-'+sid+'" style="font-size:11px;min-width:36px;text-align:center;">'+(idxAtual+1)+'/'+slides.length+'</span>'
                +'<button type="button" id="hp-'+sid+'-n" style="background:rgba(255,255,255,0.25);border:none;color:#fff;border-radius:4px;width:26px;height:26px;cursor:pointer;font-size:14px;line-height:1;">&#9654;</button>'
                +'</span></div>'
                +'<div class="hist-foto-wrap" id="hist-foto-'+sid+'">'
                +criarImgComFallback(r._foto_urls, 'width:100%;max-height:160px;object-fit:contain;background:#000;display:block;')
                +'</div>'
                +'<div id="hist-meta-'+sid+'" style="padding:6px 12px;font-size:11px;color:#718096;border-bottom:1px solid #edf2f7;">'
                +'<b style="color:#2d3748;">'+r.foto+'</b>'
                +' &nbsp;|&nbsp; '+(r.data||'--')+' '+(r.hora||'')
                +'<br>Coord.: '+lat.toFixed(5)+', '+lon.toFixed(5)
                +'<br>Tipo: '+(_tipos[r.tipo_residuo]||'--')
                +'</div>'
                +'<div id="hist-slide-'+sid+'" style="padding:8px 10px;"></div>'
                +'</div>';
        } else {
            const fotoHtml = criarImgComFallback(r._foto_urls, 'width:100%;max-height:160px;object-fit:contain;background:#000;border-radius:4px 4px 0 0;display:block;');
            popup = '<div style="min-width:220px;">'
                +fotoHtml
                +'<div style="background:'+cor+';color:#fff;font-weight:700;padding:6px 12px;font-size:12px;">&#128119; Fiscal — '+(_labels[st]||st)+'</div>'
                +'<div style="padding:8px 12px;font-size:12px;line-height:1.9;color:#2d3748;">'
                +'<b>Foto:</b> '+(r.foto||'--')+'<br>'
                +'<b>Tipo:</b> '+(_tipos[r.tipo_residuo]||'--')+'<br>'
                +'<b>Data:</b> '+(r.data||'--')+' '+(r.hora||'')+'<br>'
                +'<b>Coord.:</b> '+lat.toFixed(6)+', '+lon.toFixed(6)
                +'</div></div>';
        }

        const marker = _trackMarker(L.marker([lat,lon],{icon:icone(cor,tipoAg(st,r.tipo_residuo))}), cor, tipoAg(st,r.tipo_residuo));
        marker.bindPopup(popup,{maxWidth:310});
        if (temHist) {
            marker.on('popupopen', function() {
                setTimeout(function() {
                    if (!window._histSlides) window._histSlides = {};
                    window._histSlides[chave] = slides;
                    _histIdx[chave] = Math.min(Math.max(0, idxAtual), slides.length - 1);
                    _renderHistSlide(chave);
                    _bindHistNav(chave);
                }, 50);
            });
        }
        marker.addTo(layer);
    });
    return layer;
}

function setModo(modo){
    _modo=modo;
    ['alunos','agentes','ambos'].forEach(m=>{
        const id='btn-'+m.replace('alunos','al').replace('agentes','ag').replace('ambos','amb');
        document.getElementById(id)?.classList.toggle('on',m===modo);
    });
    if(_camAl) map.removeLayer(_camAl);
    if(_camAg) map.removeLayer(_camAg);
    if(modo!=='agentes'&&_camAl) _camAl.addTo(map);
    if(modo!=='alunos' &&_camAg) _camAg.addTo(map);
    atualizarLegenda();
}

function atualizarLegenda(){
    const el=document.getElementById('leg');
    let h='';
    if(_modo!=='agentes'){
        h+='<b>Alunos</b>'
            +'<div><span style="color:#e53e3e;">&#9679;</span> Grupo 01</div>'
            +'<div><span style="color:#e53e3e;">&#9679;</span> Grupo 02</div>';
        h+='<b>Tipo res&iacute;duo</b><div>&#128465; Lixo</div><div>&#127795; Poda</div><div>&#127795;&#128465; Lixo+poda</div>';
    }
    if(_modo!=='alunos'){
        h+='<b>Fiscais</b>'
            +'<div><span style="color:#e53e3e;">&#9679;</span> Ponto sem registro</div>'
            +'<div><span style="color:#d69e2e;">&#9679;</span> Recorr&ecirc;ncia</div>'
            +'<div><span style="color:#38a169;">&#9679;</span> Local limpo (&#10003;)</div>';

    el.innerHTML=h;
}

async function init(){
    map = L.map('map').setView([-7.748,-34.831],13);
    map.on('zoomend', _agendarEscalaPinos);
    map.on('zoom', _agendarEscalaPinos);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
        attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:19}).addTo(map);

    if(!SHEET_ID||SHEET_ID.includes('COLE_')){
        document.getElementById('load').innerHTML='<div style="font-size:2rem;">&#9888;</div>'
            +'<b>Configure o SHEET_ID no index.html</b>'
            +'<p style="font-size:0.8rem;color:#718096;margin-top:6px;">Substitua 1Q9hG2uVnnP0kbKCdiVjUWwhW6Bi9TjajEYXS0dlZMsk pelo ID real.</p>';
        return;
    }
    try{
        const [rAl,rAg] = await Promise.all([
            lerAba(ABA_ALUNOS).catch(e=>{ console.error('[alunos]',e); return []; }),
            lerAba(ABA_AGENTES).catch(e=>{ console.error('[agentes]',e); return []; }),
        ]);
        _dadosAl = rAl;
        _dadosAg = rAg;
        console.log('[index] alunos carregados:', rAl.length, '| agentes carregados:', rAg.length);
        document.getElementById('stat-al').textContent = rAl.length+' pontos alunos';
        document.getElementById('stat-ag').textContent = rAg.length+' pontos agentes';
        if (!rAl.length && !rAg.length) {
            document.getElementById('load').innerHTML='<div style="font-size:2rem;">&#9888;</div>'
                +'<b>Nenhum dado encontrado</b>'
                +'<p style="font-size:0.8rem;color:#718096;margin-top:6px;">Verifique se a planilha está pública e as abas "'+ABA_ALUNOS+'" e "'+ABA_AGENTES+'" existem.<br>Abra o console (F12) para mais detalhes.</p>';
            return;
        }
        _reaplicarCamadas();
        setTimeout(() => _iniciarBairros(), 100);
        const todos = [...rAl,...rAg].filter(r=>{
            const lat=parseFloat(r.latitude), lon=parseFloat(r.longitude);
            return !isNaN(lat) && !isNaN(lon) && _coordValida(lat,lon);
        }).map(r=>[parseFloat(r.latitude),parseFloat(r.longitude)]);
        if(todos.length) map.fitBounds(L.latLngBounds(todos),{padding:[20,20],maxZoom:16});
        document.getElementById('load').style.display='none';
    }catch(e){
        console.error('[index] erro geral:', e);
        document.getElementById('load').innerHTML='<div style="font-size:2rem;">&#9888;</div><b>Erro ao carregar</b><p style="font-size:0.8rem;color:#718096;margin-top:6px;">'+e.message+'</p>';
    }

let _camadaBairros = null;
let _bairroSelecionado = null;
let _menuAberto = false;

function toggleMenu() {
    _menuAberto = !_menuAberto;
    document.getElementById('menu-lateral').style.left = _menuAberto ? '0' : '-280px';
    document.getElementById('menu-overlay').style.display = _menuAberto ? 'block' : 'none';
}

function toggleBairros(ativo) {
    if (ativo) {
        if (_camadaBairros) _camadaBairros.addTo(map);
    } else {
        if (_camadaBairros) map.removeLayer(_camadaBairros);
    }
}

function mostrarTodos() {
    _bairroSelecionado = null;
    document.getElementById('filtro-bairro-wrap').style.display = 'none';
    _reaplicarCamadas();
}

const _cacheBairros = {};
function _bairroDoPin(lat, lon) {
    const key = lat.toFixed(4)+'_'+lon.toFixed(4);
    if (_cacheBairros[key] !== undefined) return _cacheBairros[key];
    for (const b of BAIRROS_ITAMARACA) {
        if (_pontoNoBairro(lat, lon, b.poligono)) {
            _cacheBairros[key] = b;
            return b;
        }
    }
    _cacheBairros[key] = null;
    return null;
}

function _pontoNoBairro(lat, lon, poligono) {
    const pts = poligono[0];
    let dentro = false, j = pts.length - 1;
    for (let i = 0; i < pts.length; i++) {
        const yi = pts[i][0], xi = pts[i][1];
        const yj = pts[j][0], xj = pts[j][1];
        if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)
            dentro = !dentro;
        j = i;
    }
    return dentro;
}

function _iniciarBairros() {
    _camadaBairros = L.layerGroup();
    BAIRROS_ITAMARACA.forEach(b => {
        const poly = L.polygon(b.poligono, {
            color: '#111111', weight: 2,
            fillColor: '#000000', fillOpacity: 0,
            className: 'bairro-poly'
        });
        poly.bindTooltip(b.nome, {permanent: false, direction: 'center', className: 'tooltip-bairro'});
        poly.on('click', () => {
            _bairroSelecionado = b;
            document.getElementById('filtro-bairro-nome').textContent = b.nome;
            document.getElementById('filtro-bairro-wrap').style.display = 'block';
            _reaplicarCamadas();
            if (!_menuAberto) toggleMenu();
        });
        poly.on('mouseover', function() { this.setStyle({weight: 3, color: '#000'}); });
        poly.on('mouseout',  function() { this.setStyle({weight: 2, color: '#111111'}); });
        poly.addTo(_camadaBairros);
    });
    _camadaBairros.addTo(map);
}
